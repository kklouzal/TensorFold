# Builds the CUDA serving image natively for linux/amd64 and linux/arm64 from
# deploy/gb10/Dockerfile, runs the CPU verification set inside each image, then
# publishes one multi-architecture tag with a signed build-provenance attestation.
# GPU and full-model checks are not possible on hosted runners; deployments keep
# their own on-host qualification (deploy/gb10/README.md).
name: Containers

on:
  push:
    branches: [python-0.6]
    tags: ['v*']
  pull_request:
    branches: [python-0.6]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: containers-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/kklouzal/tensorfold

jobs:
  build:
    name: build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      # The image is ~14 GB uncompressed on top of an NGC CUDA base. Remove unused
      # preinstalled toolchains and keep Docker's data on the largest filesystem.
      - name: Make disk space for the CUDA image
        run: |
          df -h / /mnt 2>/dev/null || df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift /opt/microsoft /usr/local/julia*
          docker system prune --all --force
          root=$(df --output=avail -B1 / | tail -1)
          mnt=$(mountpoint -q /mnt && df --output=avail -B1 /mnt | tail -1 || echo 0)
          if [ "$mnt" -gt "$root" ]; then
            sudo systemctl stop docker docker.socket
            sudo mkdir -p /mnt/docker
            config=/etc/docker/daemon.json
            { [ -s "$config" ] && sudo cat "$config" || echo '{}'; } \
              | jq '. + {"data-root": "/mnt/docker"}' | sudo tee "$config.new" >/dev/null
            sudo mv "$config.new" "$config"
            sudo systemctl start docker
          fi
          docker info --format 'Docker root: {{.DockerRootDir}}'
          df -h / /mnt 2>/dev/null || df -h /

      - name: Build verification image
        run: |
          docker buildx build --load --target verification \
            --build-arg SOURCE_REVISION="${GITHUB_SHA}" \
            --tag tensorfold-ci:verification --file deploy/gb10/Dockerfile .

      # The documented CPU verification set (native SSD reader, Harness tokenizer
      # bridge, YaRN admission) plus prefix retention, request ticks, copy drafts
      # and six-bit RotorQuant contracts, against the installed package.
      - name: CPU verification
        run: |
          docker run --rm --network none --memory 3g --memory-swap 3g --pids-limit 512 \
            --cpus 2 -e OMP_NUM_THREADS=1 -e OPENBLAS_NUM_THREADS=1 \
            tensorfold-ci:verification -o pythonpath=tests -p no:cacheprovider -q \
            tests/test_native_ssd.py tests/test_harness_tokenizer.py tests/test_qwen4_exp_yarn.py \
            tests/test_flashnext_prefix_retention.py tests/test_cuda_request_ticks.py \
            tests/test_copy_drafts.py tests/test_rotorquant_six_scaling.py

      - name: Build runtime image
        run: |
          docker image rm tensorfold-ci:verification
          docker buildx build --load --target runtime \
            --build-arg SOURCE_REVISION="${GITHUB_SHA}" \
            --tag "${IMAGE}:${GITHUB_SHA::12}-${{ matrix.arch }}" --file deploy/gb10/Dockerfile .
          docker image inspect "${IMAGE}:${GITHUB_SHA::12}-${{ matrix.arch }}" \
            --format 'revision={{index .Config.Labels "org.opencontainers.image.revision"}} platform={{.Os}}/{{.Architecture}} size={{.Size}}'

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push architecture image
        if: github.event_name != 'pull_request'
        run: |
          tag="${IMAGE}:${GITHUB_SHA::12}-${{ matrix.arch }}"
          docker push "$tag"
          digest=$(docker image inspect "$tag" --format '{{index .RepoDigests 0}}')
          digest=${digest#*@}
          case "$digest" in sha256:*) ;; *) echo "No pushed digest for $tag" >&2; exit 1 ;; esac
          mkdir -p digests
          echo "$digest" > "digests/${{ matrix.arch }}"
          echo "Pushed $tag as $digest"

      - name: Record digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digest-${{ matrix.arch }}
          path: digests/${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true

      - uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-architecture tags
        id: manifest
        run: |
          # Commit tags plus the branch (python-0.6) or release tag name.
          tags=(--tag "${IMAGE}:${GITHUB_SHA::12}" --tag "${IMAGE}:${GITHUB_SHA}" --tag "${IMAGE}:${GITHUB_REF_NAME}")
          docker buildx imagetools create "${tags[@]}" \
            "${IMAGE}@$(cat digests/amd64)" "${IMAGE}@$(cat digests/arm64)"
          digest=$(docker buildx imagetools inspect "${IMAGE}:${GITHUB_SHA}" --format '{{json .Manifest}}' | jq -r .digest)
          docker buildx imagetools inspect "${IMAGE}@${digest}"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true
