name: tensorfold-gb10-gemma4

services:
  tensorfold:
    image: ${TENSORFOLD_IMAGE:?Set the immutable TensorFold runtime image}
    container_name: gemma4-26b-tf
    entrypoint: [python3, /opt/harness/cuda_entrypoint.py, python3, /opt/harness/tensorfold_harness.py]
    command:
      - serve
      - /model
      - --backend
      - cuda
      - --precision
      - checkpoint
      - --name
      - gemma4-26b
      - --host
      - 0.0.0.0
      - --port
      - '8888'
      - --drafter
      - /drafter
      - --drafter-bits
      - '16'
      - --draft-rows
      - ${TENSORFOLD_DRAFT_ROWS:-5}
      - --parallel
      - '1'
      - --context
      - '0'
      - --kv-dtype
      - bf16
      - --vision
      - --no-thinking
      - --thinking-budget
      - '0'
    environment:
      HF_HUB_OFFLINE: '1'
      TENSORFOLD_NO_UPDATE_CHECK: '1'
      TENSORFOLD_MEMORY_RESERVE_GIB: '8'
      TENSORFOLD_CUDA_MEMORY_RESERVE_GIB: '0'
      MAX_JOBS: '20'
      OMP_NUM_THREADS: '20'
      MKL_NUM_THREADS: '20'
    volumes:
      - type: bind
        source: ${TENSORFOLD_MODEL_PATH:?Set the complete pinned AEON NVFP4 directory}
        target: /model
        read_only: true
      - type: bind
        source: ${TENSORFOLD_DRAFTER_PATH:?Set the complete pinned BF16 DFlash directory}
        target: /drafter
        read_only: true
      - type: bind
        source: ${TENSORFOLD_CACHE:?Set the writable kernel cache directory}
        target: /cache
    devices:
      - nvidia.com/gpu=${TENSORFOLD_GPU_UUID:?Set the GB10 GPU UUID}
    cpuset: ${TENSORFOLD_CPUSET:-0-19}
    network_mode: host
    ipc: host
    restart: unless-stopped
    ulimits:
      memlock: -1
      stack: -1
      nofile: 1048576
    logging:
      driver: local
      options:
        max-size: 20m
        max-file: '3'
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8888/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      start_period: 15m
      retries: 3
