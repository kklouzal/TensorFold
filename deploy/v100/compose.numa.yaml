# Optional RAM-archive override. The base eight-V100 profile already requires
# the worker-purpose derived NUMA policy for CPU+memory binding. That policy
# includes the original archive's mbind/self-query rules; archive-only profiles
# lack set_mempolicy and cannot satisfy the worker bootstrap. No extra capability
# or unconfined policy is required. Set TF_INDEXER_HISTORY=ram to use the archive.
services:
  tensorfold:
    security_opt:
      - "seccomp=${TF_NUMA_SECCOMP:?Set TF_NUMA_SECCOMP to the generated host seccomp.json path}"
